<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us Whitewater Rafting-GDL</title>
    <meta name="description"
        content="Contact us. We would like to hear from you, we invite you to be part of our rafting community. Please share with us your thoughts and plans">
    <meta name="author" content="Eduardo Galvan">
    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="wwrlogo ">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>

        </nav>

    </header>

    <main>
        <div class="contact1">
            <h3>White Water Rafting GDL</h3>

            <p>1550 Boul. St-Laurent
                Quebec, QC
                Tel. +1 999 999 9999
                info@wwr-gdl.com</p>
        </div>

        <div class="container-1">

            <div>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7004.234207866973!2d-71.15956329255513!3d46.890414986335294!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cb8bf68a71b4a8f%3A0x5bc0a755a2b9265f!2sLes%20Rapides!5e0!3m2!1ses!2sca!4v1764361145880!5m2!1ses!2sca"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <div class="newsletter2">
                    <div>
                        <label for="fullname">Full name:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>

                    <div>
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>


                    <div>
                        <p>Message purpose:</p>
                        <input type="radio" id="GI" name="message">
                        <label for="GI">General Inquiry</label>
                    </div>

                    <div>
                        <input type="radio" id="RQ" name="message">
                        <label for="RQ">Reservation Question</label>
                    </div>

                    <div>
                        <input type="radio" id="WS" name="message">
                        <label for="WS">Website Suggestion</label>
                    </div>

                    <div>
                        <label for="message2">Message</label>
                        <textarea name="message2" id="message2" rows="4"></textarea>
                    </div>

                    <div>
                        <label for="suscribe">I would like to receive special offers</label>
                        <input type="checkbox" id="suscribe" name="suscribe">
                    </div>
                    <div class="button">
                        <button type="submit">Suscribe now</button>
                    </div>
                </div>

            </form>
        </div>


        <div class="contact1">
            <h1 class="service">We are here to serve you</h1>


            <section class="container-4">
                <figure>
                    <img src="images/cool-instructor.jpg" alt="cool-instructor">
                    <figcaption>Cool-instructor</figcaption>
                </figure>

                <figure>
                    <img src="images/funny-instructor.jpg" alt="funny-instructor">
                    <figcaption>Funny-instructor</figcaption>
                </figure>

                <figure>
                    <img src="images/cowboy-instructor.jpg" alt="cowboy-instructor">
                    <figcaption>Cowboy-instructor</figcaption>
                </figure>


            </section>
        </div>



    </main>

    <footer class="container3">
        <p>©️2025 🚣Whitewater Rafting-GDL Eduardo Galvan</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com/" target="_blank">Facebook
                <img src="images/facebook-icon.png" alt="Facebook Icon">
            </a>
            <a href="https://www.instagram.com/" target="_blank">Instagram
                <img src="images/instagram-icon.png" alt="Instagram Icon">
            </a>

            <a href="https://www.linkedin.com/" target="_blank">Linkedin
                <img src="images/linkedin-icon.png" alt="Linkedin Icon">
            </a>

        </nav>
    </footer>

</body>

</html>
