<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Quiz HTML</h1>
        <form class="box">

            <div class="quiz-item box">
                <label for="q1">1. The CSS property used to control the element's font-size is...</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="quiz-item box">
                <label for="q2">2. The HTML attribute used to define the internal stylesheet is...</label>
                <textarea name="q2" id="q2"></textarea>
            </div>

            <div class="quiz-item box">
                <label for="q3">3. Which of the following property is used as the shorthand property for the padding
                    properties?</label>

                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose one...</option>
                    <option value="O2">padding-right</option>
                    <option value="O3">padding-left</option>
                    <option value="04">padding</option>
                    <option value="all">All of the above</option>
                </select>
            </div>

            <div class="quiz-item box">
                <label for="q4">4. What is the top margin given this declaration?</label>
                <code class="box">margin: 10px 5px 15px</code>
                <input type="number" name="q4" id="q4">
            </div>
            <button>Submit Quiz</button>
        </form>

    </main>
</body>

</html>
