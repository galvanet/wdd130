<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll-form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <form>

        <div class="form-item">
            <label for="fullname">Full name:</label>
            <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="column2">
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>
        </div>

        <div class="column1">
            <label for="quantity">Select Quantity</label>

            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>

            </select>

            <label for="browser">What is your favorite browser?</label>

            <select name="browser" id="browser">
                <option value="Chrome">Chrome</option>
                <option value="Safari">Safari</option>
                <option value="Edge">Edge</option>
                <option value="Othet">Other</option>

            </select>
        </div>

        <div>
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
        </div>

        <label for="feedback">List the places you have lived.</label>
        <textarea name="feedback" id="feedback" placeholder="Mexico, Japan, Canada" rows="4"></textarea>


        <button>Submit Poll</button>
    </form>


</body>

</html>
